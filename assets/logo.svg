<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景渐变：现代科技蓝紫 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <!-- 卡片质感渐变 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <!-- 投影 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 主图标背景底座 (带安全边距与柔和圆角) -->
  <rect x="14" y="14" width="100" height="100" rx="26" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- 象征会话长图的层叠卡片效果 -->
  <!-- 底层略偏移的长图卡片 -->
  <rect x="36" y="26" width="56" height="76" rx="8" fill="#ffffff" fill-opacity="0.35" transform="rotate(-6 64 64)"/>

  <!-- 主长图分享卡片 -->
  <rect x="38" y="26" width="52" height="76" rx="8" fill="url(#cardGrad)" filter="url(#dropShadow)"/>

  <!-- 卡片头部小装饰条 (代表标题栏) -->
  <rect x="44" y="32" width="22" height="4" rx="2" fill="#3b82f6"/>
  <circle cx="82" cy="34" r="2" fill="#10b981"/>

  <!-- 卡片内第一条气泡 (用户提问) -->
  <rect x="44" y="42" width="40" height="14" rx="4" fill="#dbeafe"/>
  <rect x="48" y="46" width="24" height="2.5" rx="1" fill="#2563eb"/>
  <rect x="48" y="50" width="32" height="2" rx="1" fill="#3b82f6" fill-opacity="0.7"/>

  <!-- 卡片内第二条气泡 (AI 回答) -->
  <rect x="44" y="60" width="40" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="48" y="65" width="30" height="2.5" rx="1" fill="#334155"/>
  <rect x="48" y="70" width="32" height="2" rx="1" fill="#64748b"/>
  <rect x="48" y="74" width="20" height="2" rx="1" fill="#94a3b8"/>

  <!-- 分割线 -->
  <line x1="44" y1="84" x2="84" y2="84" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- 闪电分享火花徽章 (置于右下角，象征一键秒发) -->
  <circle cx="86" cy="88" r="16" fill="#10b981" filter="url(#dropShadow)"/>
  <path d="M86 78 L80 88 L85 88 L83 98 L92 86 L87 86 Z" fill="#ffffff"/>
</svg>
